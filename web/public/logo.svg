<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>RAGFlow</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#43CDE9"/>
      <stop offset="100%" stop-color="#4E40EC"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="180" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#53F3FD"/>
      <stop offset="100%" stop-color="#4E40EC"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="90" cy="90" r="88" fill="url(#g)" opacity="0.06"/>
  <circle cx="90" cy="90" r="88" stroke="url(#g)" stroke-width="2.5"/>

  <!-- 三个数据节点 -->
  <circle cx="90"  cy="44" r="10" fill="url(#g2)"/>
  <circle cx="44"  cy="136" r="10" fill="url(#g)"/>
  <circle cx="136" cy="136" r="10" fill="url(#g)"/>

  <!-- 连接线 -->
  <path d="M90 54 L51 128"  stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 54 L129 128" stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 136 L126 136"  stroke="url(#g)" stroke-width="3" stroke-linecap="round"/>

  <!-- 中心圆环 -->
  <circle cx="90" cy="95" r="22" fill="none" stroke="url(#g2)" stroke-width="3"/>
  <circle cx="90" cy="95" r="12" fill="url(#g2)"/>
</svg>
